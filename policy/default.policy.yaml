# Commands are enforced in code in evaluator.ts
version: "1.0"

limits:
  maxCallsPerTask: 100

files:
  denyPatterns:
    - "(^|/)\\.env($|/|\\..*)"
    - "(^|/)\\.envrc($|/|\\..*)"
    - ".*\\.pem$"
    - ".*\\.key$"
    - "(^|/)id_rsa.*"
    - "(^|/)id_ed25519.*"
    - ".*\\.p12$"
    - ".*\\.pfx$"
    - "(^|/)credentials\\.json$"
    - "(^|/)\\.git($|/.*)"
    - "(^|/)\\.netrc$"
    - "(^|/)\\.git-credentials$"
    - "(^|/)\\.pypirc$"
    - "(^|/)\\.aws/credentials$"
    - "(^|/)\\.docker/config\\.json$"
    - ".*\\.tfvars$"
    - ".*\\.jks$"
    - ".*\\.keystore$"
    - ".*\\.p8$"
    - "(^|/)\\.npmrc$"
  askPatterns:
    - pattern: "^\\.github(/.*)?$"
      operations:
        - "write"
        - "edit"
      reason: "Changes to CI workflows (.github/**) require human approval"
    - pattern: "(^|/)policy(/.*)?$|.*policy.*\\.ya?ml$"
      operations:
        - "write"
        - "edit"
      reason: "Changes to policy files or directory require human approval"
    - pattern: ".*audit.*"
      operations:
        - "write"
        - "edit"
      reason: "Changes to audit files require human approval"
